[package]
name = "hyprkontrol"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "System settings for CachyOS on Hyprland"
license = "MIT"
repository = "https://github.com/lebelokamogelo/HyprKontrol"

[dependencies]
iced = { version = "0.14", features = ["svg", "canvas", "tokio", "image-without-codecs", "advanced"] }
iced_runtime = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
pty-process = { version = "0.5", features = ["async"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["process", "fs", "time", "io-util", "rt", "macros", "sync"] }
toml = "1.2.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
iced_test = "0.14"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
