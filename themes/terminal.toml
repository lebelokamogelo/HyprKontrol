# Square corners, tight rows and a monospaced interface.
name = "Terminal"
author = "HyprKontrol"
base = "cachyos-dark"

[colors]
background = "#0d1117"
rail = "#0d1117"
sidebar = "#0d1117"
card = "#131a22"
raised = "#1f3a34"
track = "#2c3a44"
knob = "#d7e2de"
line = "#8fb7a833"
text = "#dfe9e5"
text_dim = "#afc3bb"
text_mute = "#8ca399"
accent = "#82dccc"
on_accent = "#06251f"
live = "#01ccff"

[fonts]
ui = "Adwaita Mono"

[metrics]
card_radius = 0
control_radius = 0
card_border = 1
density = 0.82
gap = 14
content_padding = 24
text_size = 13
